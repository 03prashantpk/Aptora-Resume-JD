[project]
name = "jd-resume-server"
version = "0.1.0"
description = "JD-Resume FastAPI backend. Phase 1: Tectonic compile service."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pymupdf>=1.26",   # PDF -> pixmap rasterization (preview page images)
  "pillow>=11",      # transcode pixmap -> WebP (PyMuPDF can't emit WebP)
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
